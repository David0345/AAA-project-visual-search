[project]
name = "aaa-project-visual-search"
version = "0.1.0"
description = "Мультимодальный поиск по каталогу (image / txt / multimodal)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "transformers>=5.9.0",
    "hydra-core>=1.3.2",
    "sentencepiece>=0.2.1",
]

# Опциональные группы. Сейчас фокус на экспериментах — serving ставим на этапе
# деплоя: `uv sync --extra serving`.
[project.optional-dependencies]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_search"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
