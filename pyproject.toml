[project]
name = "aaa-project-visual-search"
version = "0.1.0"
description = "Мультимодальный поиск по каталогу (image / txt / multimodal)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "faiss-cpu>=1.14.2",
    "transformers>=5.9.0",
    "open-clip-torch>=2.24.0",
]

# Опциональные группы. Сейчас фокус на экспериментах — serving ставим на этапе
# деплоя: `uv sync --extra serving`.
[project.optional-dependencies]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

# pip install -e ".[experiments]" или uv sync --extra experiments
experiments = ["wandb>=0.16"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visual_search"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
