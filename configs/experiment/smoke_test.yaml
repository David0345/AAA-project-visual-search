# @package _global_

data:
  train_path: data/processed/train_mini.parquet # Путь к мини-файлу
  batch_size: 16                                # Маленький батч
  num_workers: 0
  pin_memory: false                             # Откл для CPU/отладки

train:
  epochs: 2
  gradient_accumulation: 1
  max_grad_norm: 1.0
  log_every: 1
  checkpoint_every: 10                          
  amp: true                                     

output_dir: experiments/smoke_test_run
device: auto

random_seed:
  fix: true
  seed: 42
  deterministic_algorithms: false